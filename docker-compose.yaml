name: jeri-app-chat
services:
    keycloak:
        container_name: keycloak
        image: keycloak/keycloak:26.5
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
            JAVA_OTPS_APPEND: "-Xms256m -Xmx512m"
        ports:
            - 8081:8080
        command:
            - start-dev
        networks:
            - jeri-app-chat-network
        mem_limit: 512m
        cpus: 1.0

    elasticsearch:
        container_name: elastichsearch
        image: elasticsearch:9.2.4
        environment:
            discovery.type: single-node
            ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
            - 9200:9200
            - 9300:9300
        networks:
            - jeri-app-chat-network
        mem_limit: 512m
        cpus: 1.0

    minio:
        container_name: minio
        image: minio/minio:latest
        environment:
            MINIO_DEFAULT_BUCKETS: admin
            MINIO_ROOT_USER: admin
            MINIO_ROOT_PASSWORD: 123456789
        command: [ "server", "--console-address", ":9001", "/data" ]
        ports:
            - 9000:9000
            - 9001:9001
        networks:
            - jeri-app-chat-network
        mem_limit: 256m
        cpus: 0.5

    
    postgres:
        container_name: postgres
        image: postgres:16.12
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: 123456789
            POSTGRES_DB: postgres
        ports:
            - 5432:5432
        networks:
            - jeri-app-chat-network
        mem_limit: 512m
        cpus: 0.5

    mongodb:
        container_name: mongodb
        image: mongo:8.2.5-noble
        environment:
            MONGO_INITDB_ROOT_USERNAME: mongodb
            MONGO_INITDB_ROOT_PASSWORD: 123456789
        ports:
            - 27017:27017
        networks:
            - jeri-app-chat-network
        mem_limit: 512m
        cpus: 0.5

    redis:
        container_name: redis
        image: redis:8.6.1
        ports:  
            - "6379:6379"
        networks:
            - jeri-app-chat-network
        mem_limit: 512m
        cpus: 0.5

    api-gateway:
        container_name: api-gateway
        build:
            context: ./backend/api-gateway
            dockerfile: Dockerfile
        ports:
            - 11000:11000
        environment:
            SERVER_PORT: 11000
        networks:
            - jeri-app-chat-network
        mem_limit: 256m
        cpus: 1.0

    user-service:
        container_name: user-service
        build:
            context: ./backend/user-service
            dockerfile: Dockerfile
        ports:
            - 11001:11001
        environment:
            SERVER_PORT: 11001
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: jeri_user_service
            DB_USER: postgres
            DB_PASSWORD: 123456789
            MINIO_HOST: minio
            MINIO_PORT: 9000
            MINIO_ACCESS_KEY: admin
            MINIO_SECRET_KEY: 123456789
            MINIO_BUCKET_NAME: jeri-user-service
        networks:
            - jeri-app-chat-network
        depends_on:
            - postgres
            - minio
            - keycloak
            - api-gateway
        mem_limit: 512m
        cpus: 0.5

    friend-service:
        container_name: friend-service
        build:
            context: ./backend/friend-service
            dockerfile: Dockerfile
        ports:
            - 11004:11004
        environment:
            MONGODB_HOST: mongodb
            MONGODB_PORT: 27017
            MONGODB_USERNAME: mongodb
            MONGODB_PASSWORD: 123456789
            MONGODB_DATABASE: jeri_friend_service
            SERVER_PORT: 11004
        networks:
            - jeri-app-chat-network
        depends_on:
            - postgres
            - mongodb
            - minio
            - keycloak
            - api-gateway
        mem_limit: 512m
        cpus: 0.5

    chat-service:
        container_name: chat-service
        build:
            context: ./backend/chat-service
            dockerfile: Dockerfile
        ports:
            - 11002:11002
        environment:
            MONGODB_HOST: mongodb
            MONGODB_PORT: 27017
            MONGODB_USERNAME: mongodb
            MONGODB_PASSWORD: 123456789
            MONGODB_DATABASE: jeri_chat_service
            SERVER_PORT: 11002
        networks:
            - jeri-app-chat-network
        depends_on:
            - postgres
            - mongodb
            - minio
            - keycloak
            - api-gateway
        mem_limit: 512m
        cpus: 0.5

    frontend:
        container_name: jeri_website
        build:
            context: ./frontend/website
            dockerfile: Dockerfile
        ports:
            - "80:80"
        depends_on:
            - api-gateway
        networks:
            - jeri-app-chat-network
        mem_limit: 256m
        cpus: 0.5
        
networks:
    jeri-app-chat-network:
        driver: bridge
