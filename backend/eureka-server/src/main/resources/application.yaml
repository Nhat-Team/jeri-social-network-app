spring:
  application:
    name: eureka-server
server:
  port: ${SERVER_PORT:11050}
eureka:
  instance:
    hostname: ${EUREKA_HOST:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:11050}/eureka/
