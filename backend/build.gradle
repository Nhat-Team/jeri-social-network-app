plugins {
    id 'java'
}

subprojects {

    group = 'io.github.nhatteam'
    version = '1.0'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}
