spring:
  application:
    name: friend-service
  flyway:
    enabled: true
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:100.69.244.58}:${DB_PORT:5432}/${DB_NAME:jeri_friend_service}
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456789}
    validate-migration-naming: true
    validate-on-migrate: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:100.69.244.58}:${DB_PORT:5432}/${DB_NAME:jeri_friend_service}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456789}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  mongodb:
    host: ${MONGODB_HOST:100.69.244.58}
    port: ${MONGODB_PORT:27017}
    username: ${MONGODB_USERNAME:mongodb}
    password: ${MONGODB_PASSWORD:123456789}
    database: ${MONGODB_DATABASE:jeri_friend_service}
    authentication-database: ${MONGODB_AUTHENTICATION_DATABASE:admin}
server:
  port: ${SERVER_PORT:11004}
  servlet:
    context-path: /friend
minio:
  endpoint: http://${MINIO_HOST:100.69.244.58}:${MINIO_PORT:9000}
  accessKey: ${MINIO_ACCESS_KEY:admin}
  secretKey: ${MINIO_SECRET_KEY:123456789}
  bucket-name: ${MINIO_BUCKET_NAME:jeri-friend-bucket}