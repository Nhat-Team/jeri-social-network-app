spring:
  application:
    name: chat-service
  mongodb:
    host: ${MONGODB_HOST:100.69.244.58}
    port: ${MONGODB_PORT:27017}
    username: ${MONGODB_USERNAME:mongodb}
    password: ${MONGODB_PASSWORD:123456789}
